services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      MEMORY: "10G"
      MAX_PLAYERS: "12"
      DIFFICULTY: "normal"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      MOTD: "U-Server Minecraft"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "10"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${RCON_PASSWORD}"

    volumes:
      - ./data:/data

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10G
