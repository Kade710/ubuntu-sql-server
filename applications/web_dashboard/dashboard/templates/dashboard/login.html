{% extends "dashboard/base.html" %}

{% block title %}
Login - Ubuntu SQL Server Dashboard
{% endblock %}

{% block content %}
<h2>Login</h2>

{% if form.errors %}
<p>Invalid username or password.</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label for="{{ form.username.id_for_label }}">
            Username
        </label>
        {{ form.username }}
    </div>

    <div>
        <label for="{{ form.password.id_for_label }}">
            Password
        </label>
        {{ form.password }}
    </div>

    <button type="submit">
        Login
    </button>
</form>
{% endblock %}
